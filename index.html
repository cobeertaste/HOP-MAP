<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HOP MAP • by Cobeer Taste</title>
    
    <!-- PWA & Theme Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="O diretório e guia de cerveja artesanal. Encontra os melhores bares e taprooms perto de ti." />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png?v=3" />

    <!-- iOS Safari Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hop-Map" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.error('[PWA] Falha ao registar o Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
